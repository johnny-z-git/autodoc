services:
  postgres:
    image: postgres:16-alpine
    container_name: autodoc-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: autodoc
      POSTGRES_PASSWORD: autodoc
      POSTGRES_DB: autodoc
    volumes:
      - autodoc_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autodoc -d autodoc"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  autodoc_pg_data:
